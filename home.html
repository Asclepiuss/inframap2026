<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Inframap</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    #map { height: 500px; }
  </style>
</head>

<body>
  <nav aria-label="Main navigation">
    <a href="#home.html">Home</a>
    <a href="#sobre.html">Sobre Nós</a>
    <a href="#servicos.html">Serviços</a>
    <a href="#contato.html">Contato</a>
  </nav>

  <main id="home">
    <section class="placeholder">
      <h1>Inframap Teresina</h1>
      <p>Portal de Reclamações de Infraestrutura</p>
    </section>
  </main>

  <div id="map"> 
  </div>    
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="">
  </script>
  <script>
    const map = L.map('map').setView([-5.0892, -42.8019], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
  </script>
  
</body>

</html>
